<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dandiya night?</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Hind:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--night:#12072b;--rani:#ff2d78;--gold:#ffc933;--teal:#19e0c4;--chalk:#fff4e0;--spin:60s;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;color:var(--chalk);font-family:"Hind",system-ui,sans-serif;background:var(--night);
background-image:radial-gradient(circle at var(--mx,50%) var(--my,35%),rgba(255,45,120,.28),transparent 38%),radial-gradient(ellipse at 50% 120%,#5b1a8f 0%,transparent 60%)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.mandala{position:fixed;left:50%;top:50%;width:max(130vmin,520px);height:max(130vmin,520px);transform:translate(-50%,-50%);opacity:.55;z-index:0;pointer-events:none}
.mandala g{transform-box:view-box;transform-origin:300px 300px;animation:spin var(--spin) linear infinite}
.mandala g:nth-child(even){animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.sticks{width:190px;height:140px;margin-bottom:10px;overflow:visible;filter:drop-shadow(0 0 14px rgba(255,201,51,.55))}
.stick{transform-box:fill-box;transform-origin:50% 100%}
#sa{transform:rotate(-24deg)}#sb{transform:rotate(24deg)}
.clack #sa{animation:ca .42s ease-in-out infinite alternate}
.clack #sb{animation:cb .42s ease-in-out infinite alternate}
@keyframes ca{from{transform:rotate(-32deg)}to{transform:rotate(-3deg)}}
@keyframes cb{from{transform:rotate(32deg)}to{transform:rotate(3deg)}}
h1{font-family:"Yatra One",Georgia,serif;font-weight:400;font-size:clamp(2.4rem,10vw,4.6rem);line-height:1.05;margin:0 0 30px;max-width:11em;text-wrap:balance;
color:#fff;text-shadow:0 0 6px #fff,0 0 18px var(--rani),0 0 42px var(--rani),0 0 80px var(--gold);animation:flick 5s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.8}94%{opacity:1}96%{opacity:.85}}
.arena{position:relative;width:min(100%,360px);height:160px}
button{font:inherit;font-weight:600;font-size:1.3rem;border:0;border-radius:999px;padding:15px 38px;cursor:pointer;position:absolute;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--chalk);outline-offset:3px}
#yes{left:0;top:22px;color:#2a1200;background:linear-gradient(180deg,#ffe27a,var(--gold));box-shadow:0 0 0 3px rgba(255,201,51,.35),0 0 28px rgba(255,201,51,.8);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(255,201,51,.12),0 0 46px rgba(255,201,51,1)}}
#no{left:calc(100% - 112px);top:22px;color:#fff;background:linear-gradient(180deg,#ff6aa2,var(--rani));box-shadow:0 0 22px rgba(255,45,120,.7);transition:left .22s cubic-bezier(.3,1.5,.5,1),top .22s cubic-bezier(.3,1.5,.5,1)}
#yes:active,#no:active{transform:scale(.94)}
.done h1{font-size:clamp(2.8rem,13vw,5.5rem);margin-bottom:14px}
.done p{font-size:1.3rem;margin:0;color:var(--gold);text-shadow:0 0 14px rgba(255,201,51,.6)}
.party{--spin:9s}
.party body,body.party{background-image:radial-gradient(circle at 50% 40%,rgba(25,224,196,.3),transparent 45%),radial-gradient(ellipse at 50% 120%,#a3125a 0%,transparent 65%)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.mandala g,.clack #sa,.clack #sb,#yes,h1{animation:none}#no{transition:none}#fx{display:none}}
</style>
</head>
<body>
<svg class="mandala" id="mandala" viewBox="0 0 600 600" aria-hidden="true"></svg>
<canvas id="fx" aria-hidden="true"></canvas>
<main id="app">
  <svg class="sticks" viewBox="0 0 190 140" aria-hidden="true">
    <g id="sa" class="stick"><rect x="68" y="10" width="16" height="126" rx="8" fill="#ffc933"/><rect x="68" y="36" width="16" height="10" fill="#ff2d78"/><rect x="68" y="62" width="16" height="10" fill="#19e0c4"/><rect x="68" y="88" width="16" height="10" fill="#ff2d78"/></g>
    <g id="sb" class="stick"><rect x="106" y="10" width="16" height="126" rx="8" fill="#19e0c4"/><rect x="106" y="36" width="16" height="10" fill="#ffc933"/><rect x="106" y="62" width="16" height="10" fill="#ff2d78"/><rect x="106" y="88" width="16" height="10" fill="#ffc933"/></g>
  </svg>
  <section id="ask">
    <h1>Will you go to Dandiya night?</h1>
    <div class="arena" id="arena">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>
  </section>
  <section id="done" class="done" hidden>
    <h1>See you there!</h1>
    <p>Wear something that spins.</p>
  </section>
</main>
<script>
// Optional: paste a form endpoint (Formspree, Google Apps Script, etc.) to collect answers.
var SUBMIT_URL='';
(function(){
  var NS='http://www.w3.org/2000/svg',cols=['#ff2d78','#ffc933','#19e0c4','#a855f7'];
  var man=document.getElementById('mandala'),rings=[[270,28,13],[215,22,11],[160,16,10],[108,12,8],[60,8,6]];
  rings.forEach(function(r,k){
    var g=document.createElementNS(NS,'g');
    for(var i=0;i<r[1];i++){
      var a=i/r[1]*Math.PI*2,x=300+Math.cos(a)*r[0],y=300+Math.sin(a)*r[0];
      var c=document.createElementNS(NS,'circle');
      c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',r[2]);
      c.setAttribute('fill',cols[(i+k)%4]);c.setAttribute('fill-opacity','.35');
      c.setAttribute('stroke',cols[(i+k+1)%4]);c.setAttribute('stroke-width','2');
      g.appendChild(c);
      var d=document.createElementNS(NS,'circle');
      d.setAttribute('cx',x-r[2]*.3);d.setAttribute('cy',y-r[2]*.3);d.setAttribute('r',r[2]*.28);d.setAttribute('fill','#fff');d.setAttribute('fill-opacity','.8');
      g.appendChild(d);
    }
    man.appendChild(g);
  });

  var cv=document.getElementById('fx'),cx=cv.getContext('2d'),P=[],W=0,H=0,running=false,
      still=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){var d=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);}
  size();addEventListener('resize',size);
  function spark(x,y,n,pw,g){
    if(still)return;
    for(var i=0;i<n;i++){var a=Math.random()*6.283,v=(.3+Math.random())*pw;
      P.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:g,l:1,s:1+Math.random()*2.5,c:cols[i%4]});}
    if(!running){running=true;requestAnimationFrame(tick);}
  }
  function tick(){
    cx.clearRect(0,0,W,H);cx.globalCompositeOperation='lighter';
    P=P.filter(function(p){return p.l>0;});
    P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.985;p.l-=.014;
      cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.283);cx.fill();});
    if(P.length)requestAnimationFrame(tick);else{running=false;cx.clearRect(0,0,W,H);}
  }
  addEventListener('pointermove',function(e){
    document.body.style.setProperty('--mx',(e.clientX/W*100)+'%');document.body.style.setProperty('--my',(e.clientY/H*100)+'%');
    if(e.pointerType!=='touch')spark(e.clientX,e.clientY,1,.8,.02);
  });

  var AC=null;
  function clack(t){
    try{
      AC=AC||new (window.AudioContext||window.webkitAudioContext)();
      var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t;
      o.type='square';o.frequency.setValueAtTime(1900,n);o.frequency.exponentialRampToValueAtTime(600,n+.05);
      g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.18,n+.003);g.gain.exponentialRampToValueAtTime(.0001,n+.07);
      o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+.08);
    }catch(e){}
  }

  var app=document.getElementById('app'),ask=document.getElementById('ask'),done=document.getElementById('done'),
      yes=document.getElementById('yes'),no=document.getElementById('no'),arena=document.getElementById('arena'),
      tries=0,armed=false,said=false,labels=['No','Sure?','Really?','Think again','Okay, yes'];
  function say(quiet,src){
    if(said)return;said=true;
    ask.hidden=true;done.hidden=false;app.classList.add('clack');document.body.classList.add('party');
    document.documentElement.style.setProperty('--spin','9s');
    if(quiet===true)return;
    try{localStorage.setItem('dandiya','yes');}catch(e){}
    if(SUBMIT_URL){try{fetch(SUBMIT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'answer=yes&time='+encodeURIComponent(new Date().toISOString())});}catch(e){}}
    var r=src?src.getBoundingClientRect():{left:W/2,top:H/2,width:0,height:0},sx=r.left+r.width/2,sy=r.top+r.height/2;
    spark(sx,sy,120,7,.12);
    for(var i=0;i<8;i++){(function(i){
      setTimeout(function(){spark(W*(.15+Math.random()*.7),H*(.15+Math.random()*.4),70,6,.1);},400+i*380);
    })(i);}
    for(var k=0;k<14;k++)clack(k*.42);
  }
  function dodge(e){
    if(tries>=4)return;
    e.preventDefault();tries++;
    var r=no.getBoundingClientRect();spark(r.left+r.width/2,r.top+r.height/2,26,4,.1);
    no.textContent=labels[tries];
    if(tries>=4){no.style.left='calc(100% - '+(no.offsetWidth+4)+'px)';no.style.top='22px';setTimeout(function(){armed=true;},400);return;}
    var mx=arena.clientWidth-no.offsetWidth,my=arena.clientHeight-no.offsetHeight;
    no.style.left=Math.max(0,Math.random()*mx)+'px';no.style.top=Math.max(0,Math.random()*my)+'px';
  }
  yes.addEventListener('click',function(){say(false,yes);});
  no.addEventListener('pointerdown',dodge);
  no.addEventListener('click',function(e){if(armed)say(false,no);else e.preventDefault();});
  try{if(localStorage.getItem('dandiya')==='yes')say(true);}catch(e){}
})();
</script>
</body>
</html>
